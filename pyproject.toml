[project]
name = "streaming-discovery-assistant"
version = "0.1.0"
description = "Multi-agent, terminal-based streaming discovery assistant (TMDB-backed, spec-driven, test-first)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-ai>=2.47.0",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streaming_discovery"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "contract: validates a Pydantic contract at an agent handoff boundary",
    "unit: exercises a single deterministic unit (helper, filter, scoring rule)",
    "tmdb_adapter: exercises the TMDB adapter (real client against a mocked transport, or the fixture-backed fake)",
    "integration: exercises multiple components together, still fixture-backed",
    "e2e: exercises a full quickstart.md scenario end-to-end, fixture-backed",
    "adversarial: exercises a deliberately hostile/malformed input case",
]
